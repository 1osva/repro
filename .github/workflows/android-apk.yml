name: Build Android APK

on:
  push:
    branches: [main, '2.1']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar la app web (carpeta www)
        run: npm run build:www

      - name: Generar el proyecto Android
        run: npx cap add android

      - name: Compilar el APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar el APK
        uses: actions/upload-artifact@v7
        with:
          name: nocturne-player-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar Release con el APK
        if: github.ref == 'refs/heads/2.1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: Version 2.1.${{ github.run_number }}
          target_commitish: '2.1'
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
